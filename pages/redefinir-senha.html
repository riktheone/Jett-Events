<!-- =============================================
     PÁGINA: Redefinir Senha
     ng-show="tela === 'redefinirSenha'"
============================================= -->
<section class="page" ng-show="tela === 'redefinirSenha'">
  <div class="page-top">
    <button class="btn-back" ng-click="ir(me ? 'perfil' : 'login')">← Voltar</button>
    <h2>Redefinir <span class="accent">Senha</span></h2>
  </div>
  <div class="card">
    <div class="alert alert-info" style="margin-bottom:20px">
      Para redefinir sua senha, informe seu CPF cadastrado e escolha uma nova senha.
    </div>
    <form ng-submit="redefinirSenha()" novalidate>
      <div class="form-group">
        <label>CPF cadastrado</label>
        <input type="text" ng-model="rsf.cpf" placeholder="000.000.000-00" maxlength="14">
      </div>
      <div class="form-group">
        <label>Nova senha <span class="field-hint">mínimo 6 caracteres</span></label>
        <input type="password" ng-model="rsf.novaSenha" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Confirmar nova senha</label>
        <input type="password" ng-model="rsf.confirmarSenha" placeholder="••••••••">
      </div>
      <div class="alert alert-error"   ng-show="rsErro">{{ rsErro }}</div>
      <div class="alert alert-success" ng-show="rsOk">{{ rsOk }}</div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Redefinir Senha</button>
        <button type="button" class="btn btn-ghost" ng-click="ir(me ? 'perfil' : 'login')">Cancelar</button>
      </div>
    </form>
  </div>
</section>
