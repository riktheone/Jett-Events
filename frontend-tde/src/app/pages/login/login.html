<div class="main-content page">
  <div class="card card-auth">
    <div class="card-header">
      <h1>◆ Jett Events</h1>
      <p>Sistema de Gerenciamento de Eventos</p>
    </div>

    @if (erro()) {
      <div class="alert alert-error">{{ erro() }}</div>
    }

    <div class="form-group">
      <label>CPF</label>
      <input type="text" [value]="cpf" (input)="formatarCPF($event)" placeholder="000.000.000-00">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" [(ngModel)]="senha" placeholder="••••••••">
    </div>

    <button class="btn btn-primary btn-full" (click)="login()" [disabled]="carregando()">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>
    <a routerLink="/cadastro" style="display:block;text-align:center;color:var(--texto-fraco);font-size:.88rem;margin-top:8px;">
      Não tem conta? Cadastre-se
    </a>
  </div>
</div>
