<div class="main-content page">
  <a routerLink="/eventos" class="btn-back">← Voltar</a>
  <div class="page-top">
    <h2>{{ editando() ? 'Editar Evento' : 'Novo Evento' }}</h2>
  </div>

  @if (erro()) { <div class="alert alert-error">{{ erro() }}</div> }
  @if (ok()) { <div class="alert alert-success">{{ ok() }}</div> }

  <div class="card">
    <div class="form-group">
      <label>Nome do evento *</label>
      <input type="text" [(ngModel)]="nome" placeholder="Nome">
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea [(ngModel)]="descricao" placeholder="Descrição do evento"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data de início *</label>
        <input type="date" [(ngModel)]="dt_inicio">
      </div>
      <div class="form-group">
        <label>Data de fim *</label>
        <input type="date" [(ngModel)]="dt_fim">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Limite de inscrição *</label>
        <input type="date" [(ngModel)]="dt_limite_inscricao">
      </div>
      <div class="form-group">
        <label>Número de vagas *</label>
        <input type="number" [(ngModel)]="numero_vagas" min="1">
      </div>
    </div>

    <p class="section-title">Responsável</p>
    <div class="form-group">
      <label>Nome *</label>
      <input type="text" [(ngModel)]="nome_responsavel">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>CPF *</label>
        <input type="text" [value]="cpf_responsavel" (input)="formatarCPFResponsavel($event)" placeholder="000.000.000-00">
      </div>
      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" [(ngModel)]="email_responsavel">
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" (click)="salvar()" [disabled]="carregando()">
        {{ carregando() ? 'Salvando...' : 'Salvar' }}
      </button>
      <a routerLink="/eventos" class="btn btn-ghost">Cancelar</a>
    </div>
  </div>
</div>
